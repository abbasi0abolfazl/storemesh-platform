<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b31"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=consumables-v1"><link rel="stylesheet" href="touch.css?v=role-touch-v2"><link rel="stylesheet" href="consumables.css?v=1"><title>StoreMesh PDA</title></head><body><main><header><div><small>STOREMESH PDA</small><h1>عملیات سیار</h1></div><span id="network">در حال بررسی</span></header><section class="userbar"><span class="avatar">OP</span><div><b id="identity">اپراتور وارد نشده</b><small id="selectedRole">نقش انتخاب نشده</small></div><button id="loginOpen">ورود</button></section><section id="content"></section><nav><button data-tab="scan" class="active"><i>⌗</i>اسکن</button><button data-tab="inventory"><i>▦</i>موجودی</button><button data-tab="tasks"><i>☷</i>کارها</button><button data-tab="shipping"><i>▤</i>ارسال</button><button data-tab="consumables"><i>◫</i>اقلام</button><button data-tab="queue"><i>↻</i>صف <b id="pending">۰</b></button></nav></main>
<dialog id="auth"><div class="card"><div class="auth-tabs"><button type="button" data-auth="password">رمز عبور</button><button type="button" data-auth="badge">کارت پرسنلی</button></div><div id="passwordAuth"><h2>ورود اپراتور</h2><input id="username" value="operator" placeholder="نام کاربری"><input id="password" value="operator-demo" type="password" placeholder="رمز عبور"><button id="login">ورود</button></div><div id="badgeAuth" class="hidden"><h2>اسکن کارت + PIN</h2><input id="badgeCode" data-scanner-input data-scan-verified="false" readonly inputmode="none" placeholder="برای اسکن لمس کنید"><input id="badgePin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="PIN شش‌رقمی"><button id="badgeLogin">ورود با کارت و PIN</button></div><p id="authError"></p></div></dialog>
<dialog id="roleDialog"><div class="card"><h2>انتخاب نقش عملیاتی</h2><div id="roleOptions" class="touch-options"></div><p id="roleMessage"></p></div></dialog>
<dialog id="picker"><div class="card"><h2>انتخاب زون مقصد</h2><div id="pickerOptions" class="touch-options"></div><button id="pickerClose">بستن</button></div></dialog>
<script type="module" src="app.js?v=consumables-v1"></script><script type="module" src="transfer-ui.js?v=1"></script></body></html>
